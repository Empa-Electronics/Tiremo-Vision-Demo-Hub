[project]
name = "pt-detection-yolov8s"
version = "0.1.0"
description = "Mixed-precision YOLOv8s snapshot for the VEK280 NPU with Vitis AI 6.1"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "ultralytics==8.4.183",
    "onnx",
    "onnxslim",
    "onnxruntime",
    "ipykernel>=7.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
